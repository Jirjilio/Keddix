# La web se publica en la rama gh-pages como un bundle de Vite.
# Ese bundle incluye la configuración PÚBLICA de Firebase (apiKey, authDomain...)
# porque el SDK de Firebase para navegador la necesita en el cliente.
# No es una credencial privada: la protección real está en firestore.rules.
# GitHub detecta el patrón "Google API key" y genera un falso positivo en cada
# despliegue, así que excluimos solo el archivo generado, no el código fuente.
paths-ignore:
  - "assets/index-*.js"
